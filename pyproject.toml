[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skyblock-bazaar-tool"
version = "4.0.0"
description = "Hypixel SkyBlock Bazaar / Craft / Forge / Enchant 行情分析工具（Qt 版）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "PySide6-Essentials>=6.7",
  "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "pyinstaller>=6"]

[project.scripts]
skyblock-bazaar = "skyblock_bazaar.__main__:main"

[tool.setuptools.packages.find]
include = ["skyblock_bazaar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["venv", ".venv", "craft_recipe", "forge_recipe", "enchanted_book_recipe"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF"]
# Qt 重写方法的默认参数和保留的 noqa 说明不参与告警
ignore = ["B008", "RUF100", "RUF001", "RUF002", "RUF003", "SIM105", "SIM108"]
