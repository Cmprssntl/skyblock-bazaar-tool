name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要上传到的 Release 标签
        required: true
        default: v4.0.0

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build one-file exe
        run: pyinstaller --noconfirm --log-level=WARN deploy/skyblock-bazaar-onefile.spec

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/SkyBlockBazaar.exe" -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }

      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "dist/SkyBlockBazaar.exe" --clobber
